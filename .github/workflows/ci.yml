name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGOMS_DOWNLOAD_DIR: .cache/mongodb-binaries
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-8.0.20
      - run: npm ci
      - run: npm run check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_version=8.24.3
          scan_dir="$RUNNER_TEMP/docchase-gitleaks"
          archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          checksums="gitleaks_${gitleaks_version}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          mkdir -p "$scan_dir"
          curl --retry 3 --fail --silent --show-error --location "$release/$archive" --output "$scan_dir/$archive"
          curl --retry 3 --fail --silent --show-error --location "$release/$checksums" --output "$scan_dir/$checksums"
          (
            cd "$scan_dir"
            sha256sum --check --ignore-missing "$checksums"
          )
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --redact=100 --no-banner --log-opts=--all
